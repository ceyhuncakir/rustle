[package]
name = "flow"
description = "Local offline dictation: speak, and cleaned-up text lands in the focused app."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "flow_lib"
path = "src/lib.rs"
crate-type = ["lib"]

[[bin]]
name = "flow"
path = "src/main.rs"

[features]
default = []
# GPU recognition on any graphics card through ONNX Runtime's WebGPU provider
# (Vulkan, Direct3D 12 or Metal). What scripts/install-app.sh and the
# installers build.
webgpu = ["flow-stt/webgpu"]
# GPU recognition on NVIDIA cards through the CUDA provider; needs CUDA 12 and
# cuDNN 9 on the machine. Cannot be combined with `webgpu`.
cuda = ["flow-stt/cuda"]

[dependencies]
flow-core.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
clap = { version = "4", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
# Self-update from GitHub Releases, checked against the minisign key in
# tauri.conf.json. 2.12 is the first to honour `requireSignedVersion`.
tauri-plugin-updater = "2.12"
serde.workspace = true
serde_json.workspace = true
flow-desktop.workspace = true
flow-audio.workspace = true
flow-stt.workspace = true
dirs.workspace = true
arboard = "3"
chrono.workspace = true
toml.workspace = true
# SIGTERM / SIGINT / SIGHUP, and Ctrl-C or closing the console on Windows,
# end Flow like Quit, so the GPU is handed back.
ctrlc = { version = "3", features = ["termination"] }

# The island window (src/overlay). Linux: gtk-layer-shell is loaded at run
# time, not linked, so the build does not need it; gtk is the version Tauri
# uses, for the window pointer.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
libloading = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSWindow", "NSPanel"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
raw-window-handle = "0.6"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile.workspace = true
