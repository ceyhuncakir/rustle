# Cleanup evaluation cases, run with `rustle eval` against the configured
# cleanup model. Prompt changes are easy to make and hard to judge; these
# pin down the behaviour that matters, especially the one rule that
# deletes content: keeping only what the speaker settled on, without
# eating a second request that merely sounded like a correction.
#
# Eight "real:" cases are verbatim from dictations where the failure
# actually showed up; four are Dutch.

# Injected with --profile, to check that personalisation does not cost
# accuracy (prompt length has regressed cases before).
[profile]
terms = ["Whisper Flow", "Ptyxis", "interopt", "PufferLib", "Parakeet", "auth middleware", "Figma", "Ollama", "Qwen", "Mutter"]
style = "This speaker is casual and direct, swears freely, mixes English and Dutch, uses informal openers like 'bro' and 'yo', and favours short punchy sentences."

[[case]]
name = "change of mind: drop the abandoned topic"
raw = "so I want to fix the problem where the scanner keeps timing out on big repos, um, actually no, forget the scanner, the thing I really need is the notification channels working for slack"
must = ["slack"]
must_not = ["scanner", "timing out", "timeout"]

[[case]]
name = "long change of mind, with an aside explaining it"
raw = "okay so the thing I want to do is fix the island glitch where it flashes when it appears, um, actually no, we already did that, forget the island, what I actually want now is the settings gui so I can edit the dictionary without opening a config file"
must = ["settings gui", "dictionary"]
must_not = ["island", "glitch", "flashes", "forget", "already did"]

[[case]]
name = "two requests: keep BOTH (not a retraction)"
raw = "we need to fix the scanner timeout and also add slack notifications for when a scan finishes"
must = ["scanner", "slack"]
must_not = []

[[case]]
name = "local correction: last value wins"
raw = "let's ship it on monday, no wait, tuesday"
must = ["tuesday"]
must_not = ["monday"]

[[case]]
name = "scratch that"
raw = "put the dark mode toggle in the settings page, scratch that, put it in the top bar next to the search"
must = ["top bar"]
must_not = ["settings page"]

[[case]]
name = "restart mid-sentence"
raw = "the thing is that we should, let me start over, the database needs an index on the org column"
must = ["index", "org"]
must_not = ["the thing is"]

[[case]]
name = "discourse words kept (not filler)"
raw = "yeah it works perfect"
must = ["yeah"]
must_not = []

[[case]]
name = "a question is transcribed, never answered"
raw = "hey what is the capital of france again"
must = ["capital of france"]
must_not = ["paris"]

[[case]]
name = "an instruction is transcribed, never executed"
raw = "write me a python function that sorts a list of dictionaries by key"
must = ["function"]
must_not = ["def ", "```"]

[[case]]
name = "backchannel left alone"
raw = "mm-hmm"
must = ["mm"]
must_not = ["?"]

[[case]]
name = "real: filler 'like' removed"
raw = "let's add more like uh improvements to the text output itself, like for example sometimes when I talk into it, like it still doesn't form like correct sentences in in general"
must = ["improvements", "correct sentences"]
must_not = ["more like improvements", "like it still", "like correct", "in in general"]

[[case]]
name = "real: meaningful 'like' kept"
raw = "I want it to look like the wispr flow island, something like that, and honestly I like it a lot"
must = ["like the", "something like that", "like it a lot"]
must_not = []

[[case]]
name = "real: abandoned part-word dropped"
raw = "I think like I can develop fur like faster with this"
must = ["faster"]
must_not = ["fur "]

[[case]]
name = "real: broken restart becomes a grammatical sentence"
raw = "I'm making improvements to the pipeline so that uh uh it the agent, like the pipeline itself understands what I'm saying and like articulates it well"
must = ["understands what I'm saying"]
must_not = ["it the agent", "and like articulates"]

[[case]]
name = "real: run-on split into sentences"
raw = "bro right now I'm actually typing this to you in my own whisper flow project that I've built like it's so crazy like I think I can write up to like 180 words per minute and I built this literally in 30 minutes using my own GPU"
must = ["180 words per minute"]
must_not = []
min_sentences = 3

[[case]]
name = "real: slang and swearing survive grammar repair"
raw = "bro this is so fucking crazy, hell yeah, shit like that you know that I still need to fix"
must = ["fucking", "hell yeah"]
must_not = []

[[case]]
name = "tangled sentence rephrased into what was meant"
raw = "so I have this plan uh that I wanna do about that I wanna create artboards with the paper MCP"
must = ["artboards"]
must_not = ["plan that I wanna do about that", "about that I wanna"]
max_words = 16

[[case]]
name = "clause that never lands is repaired"
raw = "the thing with the scanner is that it like when the repo is big it just sort of dies on you"
must = ["scanner"]
must_not = ["is that it like when", "sort of dies"]

[[case]]
name = "a well-formed sentence is left alone"
raw = "The settings page needs a dictionary editor and a hotkey picker."
must = ["settings page", "dictionary editor", "hotkey picker"]
must_not = []
max_words = 14

[[case]]
name = "spoken URL assembled"
raw = "go to W W dot youtube dot com and check the analytics"
must = ["youtube.com"]
must_not = ["W W dot", "dot com"]

[[case]]
name = "spoken email assembled"
raw = "send it to ceyhun at gmail dot com please"
must = ["ceyhun@gmail.com"]
must_not = [" at gmail"]

[[case]]
name = "real: garbled self-interruption untangled"
raw = "or if it actually doesn't like this sentence is not formed well, this model should also like rephrase it nicely in the way that I actually meant it"
must = ["rephrase"]
must_not = ["doesn't like this sentence", "actually doesn't like"]

[[case]]
name = "real: tool swapped across a sentence boundary"
raw = "so I have this plan uh that I wanna do about that I wanna create paper artboards uh with the paper MCP. I know actually wait uh forget about that, just use Figma for example."
must = ["figma", "artboards"]
must_not = ["paper MCP", "forget about that", "I know"]

[[case]]
name = "dutch stays dutch"
raw = "Dit werkt echt heel goed, uh, ik ben er echt heel blij mee, zeg maar."
must = ["werkt", "blij"]
must_not = ["works", "happy"]

[[case]]
name = "dutch with english loanwords stays dutch"
raw = "Kun je even eh kijken naar de de authenticatie middleware voordat we deployen?"
must = ["kun je", "middleware", "deployen"]
must_not = ["can you", "before we deploy"]

[[case]]
name = "dutch retraction resolved, in dutch"
raw = "Ik wil eigenlijk de scanner fixen, nee wacht, vergeet de scanner, ik wil dat de notificaties werken voor Slack."
must = ["notificaties", "slack"]
must_not = ["scanner", "vergeet", "nee wacht"]

[[case]]
name = "dutch keeps its casual register"
raw = "Ja joh, het werkt gewoon perfect, ik ben echt zo blij hiermee man."
must = ["ja joh", "perfect"]
must_not = ["yeah", "it works"]

[[case]]
name = "false start repaired"
raw = "can you look at the the auth mid uh middleware before the deploy"
must = ["auth middleware"]
must_not = ["uh", "the the"]
