[workspace]
resolver = "2"
members = [
    "crates/flow-core",
    "crates/flow-audio",
    "crates/flow-stt",
    "crates/flow-desktop",
    "src-tauri",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ceyhuncakir/flow"
rust-version = "1.89"

[workspace.dependencies]
flow-core = { path = "crates/flow-core" }
flow-audio = { path = "crates/flow-audio" }
flow-stt = { path = "crates/flow-stt" }
flow-desktop = { path = "crates/flow-desktop" }

anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
toml_edit = "0.23"
dirs = "6"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
keyring = "4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rand = "0.9"
sha2 = "0.10"
hound = "3.5"
tempfile = "3"
httpmock = "0.7"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
