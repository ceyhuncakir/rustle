<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="pill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#252a38"/>
      <stop offset="1" stop-color="#14161f"/>
    </linearGradient>
  </defs>

  <!-- The island itself: the app is the pill you see while dictating. -->
  <rect x="8" y="34" width="112" height="60" rx="30" fill="url(#pill)"/>
  <rect x="8.75" y="34.75" width="110.5" height="58.5" rx="29.25"
        fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Waveform, tapered at the ends exactly like the live visualiser. -->
  <g stroke="#7aa3f7" stroke-linecap="round" fill="none">
    <line x1="30"  y1="60" x2="30"  y2="68" stroke-width="5" stroke-opacity="0.45"/>
    <line x1="42"  y1="52" x2="42"  y2="76" stroke-width="5" stroke-opacity="0.70"/>
    <line x1="54"  y1="44" x2="54"  y2="84" stroke-width="5" stroke-opacity="0.95"/>
    <line x1="66"  y1="50" x2="66"  y2="78" stroke-width="5" stroke-opacity="0.95"/>
    <line x1="78"  y1="42" x2="78"  y2="86" stroke-width="5" stroke-opacity="0.70"/>
    <line x1="90"  y1="54" x2="90"  y2="74" stroke-width="5" stroke-opacity="0.45"/>
    <line x1="100" y1="60" x2="100" y2="68" stroke-width="5" stroke-opacity="0.25"/>
  </g>
</svg>
